<canvas #canvas></canvas>

<nav app-nav glass [radius]="26"></nav>

@switch (state.tab()) {
  @case ('home') {
    <section app-home></section>
  }
  @case ('work') {
    <section app-work></section>
  }
  @case ('contact') {
    <section app-contact></section>
  }
}

<div class="photo" #photo glassPhoto [radius]="photoRadius()" (click)="splash(photo)"></div>

<div class="sig">Muqimjon Mamadaliyev</div>

<div class="status"><span class="dot"></span>{{ state.t().status }}</div>
